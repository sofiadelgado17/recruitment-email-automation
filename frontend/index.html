<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#18191f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafafb" media="(prefers-color-scheme: light)" />
    <script>
      // Apply the saved (or system-preferred) theme before the first paint to
      // avoid a flash between dark and light. Mirrors lib/theme.ts.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var preferLight =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: light)').matches;
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : preferLight
                ? 'light'
                : 'dark';
          var root = document.documentElement;
          root.classList.remove(theme === 'dark' ? 'light' : 'dark');
          root.classList.add(theme);
          root.style.colorScheme = theme;
        } catch (_) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
    />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <title>Archive Recruiting AI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
